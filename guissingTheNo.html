<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Guess the Number</title>
  <style>
    /* Simple, clean styling */
    :root{
      --bg: #0f1724;
      --card: #0b1220;
      --accent: #06b6d4;
      --muted: #9aa6b2;
      --success: #10b981;
      --danger: #ef4444;
    }

    *{box-sizing: border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg, #071026 0%, #0f1724 100%);
      color: #e6eef3;
      padding: 24px;
    }

    .card{
      width: 100%;
      max-width: 460px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.6);
    }

    h1{
      margin: 0 0 8px 0;
      font-size: 22px;
      letter-spacing: -0.2px;
    }
    p.lead{
      margin: 0 0 18px 0;
      color: var(--muted);
      font-size: 14px;
    }

    .controls{
      display:flex;
      gap:10px;
      margin-bottom: 14px;
      align-items: center;
    }

    input[type="number"]{
      flex:1;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
      color: inherit;
      font-size: 16px;
    }

    button{
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #012;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }
    button.secondary{
      background: transparent;
      color: var(--muted);
      border: 1px dashed rgba(255,255,255,0.04);
    }

    .info{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 14px;
      font-size: 14px;
      color: var(--muted);
    }

    .message{
      min-height: 48px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius: 8px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.01);
      border: 1px solid rgba(255,255,255,0.02);
      color: var(--muted);
      font-weight:600;
      text-align:center;
    }

    .message.success{ color: var(--success); background: rgba(16,185,129,0.08); border-color: rgba(16,185,129,0.12);}
    .message.error{ color: var(--danger); background: rgba(239,68,68,0.06); border-color: rgba(239,68,68,0.12);}

    footer{
      margin-top: 14px;
      display:flex;
      justify-content:space-between;
      font-size:13px;
      color: var(--muted);
      align-items:center;
    }

    .small{
      font-size:12px;
      color: var(--muted);
    }

    @media (max-width:420px){
      .controls{flex-direction:column}
      button{width:100%}
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="title">
    <h1 id="title">Guess the Number</h1>
    <p class="lead">I'm thinking of a number between <strong id="minLabel">1</strong> and <strong id="maxLabel">100</strong>. Can you guess it?</p>

    <div class="controls" aria-label="Guess controls">
      <input id="guessInput" type="number" min="1" max="100" placeholder="Enter a number" aria-label="Enter your guess" />
      <button id="guessBtn">Guess</button>
      <button id="resetBtn" class="secondary" title="Restart game">Reset</button>
    </div>

    <div class="info">
      <div>Attempts: <strong id="attempts">0</strong></div>
      <div>Best: <strong id="best">—</strong></div>
    </div>

    <div id="message" class="message small" role="status" aria-live="polite">
      Make your first guess!
    </div>

    <footer>
      <div class="small">Range:
        <label><input id="minInput" type="number" value="1" style="width:64px;padding:4px;margin-left:8px;border-radius:6px;"> </label>
        <label><input id="maxInput" type="number" value="100" style="width:64px;padding:4px;margin-left:6px;border-radius:6px;"></label>
        <button id="applyRange" class="secondary" style="margin-left:8px;padding:6px 8px;">Apply</button>
      </div>
      <div class="small">Hints: too high / too low</div>
    </footer>
  </main>

  <script>
    // Guess the Number game
    (function(){
      const guessInput = document.getElementById('guessInput');
      const guessBtn = document.getElementById('guessBtn');
      const resetBtn = document.getElementById('resetBtn');
      const messageEl = document.getElementById('message');
      const attemptsEl = document.getElementById('attempts');
      const bestEl = document.getElementById('best');
      const minInput = document.getElementById('minInput');
      const maxInput = document.getElementById('maxInput');
      const applyRangeBtn = document.getElementById('applyRange');
      const minLabel = document.getElementById('minLabel');
      const maxLabel = document.getElementById('maxLabel');

      let min = 1;
      let max = 100;
      let secret = null;
      let attempts = 0;

      // Save best score in localStorage
      const BEST_KEY = 'guess_best_score';

      function readBest(){
        const b = localStorage.getItem(BEST_KEY);
        return b ? Number(b) : null;
      }
      function writeBest(n){
        localStorage.setItem(BEST_KEY, String(n));
      }
      function updateBestUI(){
        const b = readBest();
        bestEl.textContent = b === null ? '—' : b;
      }

      function newGame(){
        attempts = 0;
        attemptsEl.textContent = attempts;
        minLabel.textContent = min;
        maxLabel.textContent = max;
        secret = randomInt(min, max);
        setMessage('New number generated. Good luck!', ''); // neutral
        guessInput.disabled = false;
        guessInput.value = '';
        guessInput.focus();
      }

      function randomInt(a, b){
        // inclusive
        return Math.floor(Math.random() * (b - a + 1)) + a;
      }

      function setMessage(text, type){
        messageEl.textContent = text;
        messageEl.classList.remove('success','error');
        if(type === 'success') messageEl.classList.add('success');
        if(type === 'error') messageEl.classList.add('error');
      }

      function handleGuess(){
        const raw = guessInput.value.trim();
        if(raw === ''){
          setMessage('Please enter a number.', 'error');
          return;
        }
        const g = Number(raw);
        if(!Number.isFinite(g) || !Number.isInteger(g)){
          setMessage('Enter a whole number.', 'error');
          return;
        }
        if(g < min || g > max){
          setMessage(`Enter a number between ${min} and ${max}.`, 'error');
          return;
        }

        attempts++;
        attemptsEl.textContent = attempts;

        if(g === secret){
          setMessage(`Correct! The number was ${secret}. You took ${attempts} attempt${attempts>1?'s':''}.`, 'success');
          guessInput.disabled = true;
          // update best
          const best = readBest();
          if(best === null || attempts < best){
            writeBest(attempts);
            updateBestUI();
            setMessage(`🎉 Correct! ${secret}. New best: ${attempts} attempts.`, 'success');
          }
        } else if(g < secret){
          setMessage('Too low — try a larger number.', '');
        } else {
          setMessage('Too high — try a smaller number.', '');
        }
        guessInput.value = '';
        guessInput.focus();
      }

      // events
      guessBtn.addEventListener('click', handleGuess);
      guessInput.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          e.preventDefault();
          handleGuess();
        }
      });

      resetBtn.addEventListener('click', function(){
        newGame();
      });

      applyRangeBtn.addEventListener('click', function(){
        const newMin = Number(minInput.value);
        const newMax = Number(maxInput.value);
        if(!Number.isFinite(newMin) || !Number.isFinite(newMax) || !Number.isInteger(newMin) || !Number.isInteger(newMax)){
          setMessage('Range values must be whole numbers.', 'error');
          return;
        }
        if(newMin >= newMax){
          setMessage('Min must be less than Max.', 'error');
          return;
        }
        min = newMin;
        max = newMax;
        newGame();
      });

      // initialize
      updateBestUI();
      newGame();

      // Expose small debug (optional)
      window.__guessGame = { getSecret: () => secret };
    })();
  </script>
</body>
</html>
