<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator</title>
<style>
  body { display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial, sans-serif; background: #fff3e0; }
  #container { background: #fff; padding: 20px; border-radius: 10px; width: 300px; text-align: center; }
  input, button { width: 100%; padding: 10px; margin: 5px 0; }
</style>
</head>
<body>

<div id="container">
  <h3>BMI Calculator</h3>
  <input type="number" id="weight" placeholder="Weight (kg)">
  <input type="number" id="height" placeholder="Height (cm)">
  <button id="calculate">Calculate BMI</button>
  <div id="result" style="margin-top:10px; font-weight:bold;"></div>
</div>

<script>
document.getElementById('calculate').addEventListener('click', () => {
  const weight = parseFloat(document.getElementById('weight').value);
  const heightCm = parseFloat(document.getElementById('height').value);
  if(isNaN(weight) || isNaN(heightCm) || weight <= 0 || heightCm <= 0){
    document.getElementById('result').textContent = "Enter valid values!";
    return;
  }
  const heightM = heightCm / 100;
  const bmi = weight / (heightM * heightM);
  let category = "";
  if(bmi < 18.5) category = "Underweight";
  else if(bmi < 25) category = "Normal";
  else if(bmi < 30) category = "Overweight";
  else category = "Obese";
  document.getElementById('result').textContent = `BMI: ${bmi.toFixed(2)} (${category})`;
});
</script>

</body>
</html>
