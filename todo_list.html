<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; }
  input, button { padding: 10px; margin: 5px 0; }
  ul { list-style-type: none; padding: 0; }
  li { padding: 10px; border: 1px solid #ccc; margin-top: 5px; display: flex; justify-content: space-between; }
  li.completed { text-decoration: line-through; color: gray; }
</style>
</head>
<body>

<h2>To-Do List</h2>
<input type="text" id="taskInput" placeholder="Add a task...">
<button id="addTask">Add</button>
<ul id="taskList"></ul>

<script>
const input = document.getElementById('taskInput');
const addBtn = document.getElementById('addTask');
const list = document.getElementById('taskList');

function saveTasks() {
  const tasks = [];
  list.querySelectorAll('li').forEach(li => {
    tasks.push({ text: li.textContent.replace('❌','').trim(), done: li.classList.contains('completed') });
  });
  localStorage.setItem('tasks', JSON.stringify(tasks));
}

function loadTasks() {
  const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
  tasks.forEach(task => {
    const li = document.createElement('li');
    li.textContent = task.text;
    if(task.done) li.classList.add('completed');
    addLiEvents(li);
    list.appendChild(li);
  });
}

function addLiEvents(li) {
  li.addEventListener('click', () => {
    li.classList.toggle('completed');
    saveTasks();
  });
  const btn = document.createElement('button');
  btn.textContent = '❌';
  btn.addEventListener('click', e => {
    e.stopPropagation();
    li.remove();
    saveTasks();
  });
  li.appendChild(btn);
}

addBtn.addEventListener('click', () => {
  if(input.value.trim() === '') return;
  const li = document.createElement('li');
  li.textContent = input.value;
  addLiEvents(li);
  list.appendChild(li);
  input.value = '';
  saveTasks();
});

loadTasks();
</script>

</body>
</html>
