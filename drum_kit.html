<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drum Kit</title>
<style>
  body { display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial, sans-serif; flex-wrap: wrap; background: #ffebee; }
  button { padding: 20px; margin: 10px; font-size: 1.5em; cursor: pointer; border-radius: 10px; }
</style>
</head>
<body>

<button data-sound="clap">Clap</button>
<button data-sound="kick">Kick</button>
<button data-sound="snare">Snare</button>

<script>
const sounds = {
  clap: new Audio('https://www.soundjay.com/button/button-16.mp3'),
  kick: new Audio('https://www.soundjay.com/button/button-10.mp3'),
  snare: new Audio('https://www.soundjay.com/button/button-3.mp3')
};

document.querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => {
    const sound = sounds[btn.dataset.sound];
    sound.currentTime = 0;
    sound.play();
  });
});
</script>

</body>
</html>
