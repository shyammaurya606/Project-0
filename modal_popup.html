<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modal Popup</title>
<style>
  body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
  #openModal { padding: 10px 20px; }
  #modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
  #modalContent { background: #fff; padding: 20px; border-radius: 10px; width: 300px; text-align: center; }
  #close { margin-top: 10px; padding: 5px 10px; }
</style>
</head>
<body>

<button id="openModal">Open Modal</button>

<div id="modal">
  <div id="modalContent">
    <h3>Modal Popup</h3>
    <p>This is a simple modal.</p>
    <button id="close">Close</button>
  </div>
</div>


<script>
const modal = document.getElementById('modal');
document.getElementById('openModal').addEventListener('click', () => modal.style.display='flex');
document.getElementById('close').addEventListener('click', () => modal.style.display='none');
window.addEventListener('click', e => { if(e.target === modal) modal.style.display='none'; });
</script>

</body>
</html>
