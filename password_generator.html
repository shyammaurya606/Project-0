<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>
<style>
  body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f3e5f5; }
  #container { background: #fff; padding: 20px; border-radius: 10px; text-align: center; width: 300px; }
  input, button { width: 100%; padding: 10px; margin: 5px 0; }
</style>
</head>
<body>

<div id="container">
  <h3>Password Generator</h3>
  <input type="number" id="length" placeholder="Password Length">
  <button id="generate">Generate Password</button>
  <div id="password" style="margin-top:10px; font-weight:bold;"></div>
</div>

<script>
const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()";

document.getElementById('generate').addEventListener('click', () => {
  const len = parseInt(document.getElementById('length').value);
  if(isNaN(len) || len <= 0) {
    document.getElementById('password').textContent = "Enter a valid length!";
    return;
  }
  let pass = "";
  for(let i=0; i<len; i++) {
    pass += charset[Math.floor(Math.random()*charset.length)];
  }
  document.getElementById('password').textContent = pass;
});
</script>

</body>
</html>
